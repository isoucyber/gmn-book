name: Build e testes (Windows + Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publicar uma Release com os instaladores'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  ORG: br.com.gmnbook

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Versão do Flutter
        run: flutter --version
      - name: Habilitar build hooks (SQLite nativo)
        run: flutter config --enable-native-assets || true
      - run: flutter pub get
      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes de serviços e interface
        run: flutter test --reporter expanded

  # ---------------------------------------------------------------------------
  windows:
    name: Windows (.exe instalador)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Habilitar build hooks
        run: flutter config --enable-native-assets; exit 0
      - name: Gerar projeto Windows e aplicar identidade
        shell: bash
        run: |
          flutter create --platforms=windows --org $ORG --project-name gmn_book --no-pub .
          python tool/patch_platforms.py windows
      - run: flutter pub get
      - name: Versão
        id: ver
        shell: bash
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> $GITHUB_OUTPUT
      - name: Compilar (release)
        run: flutter build windows --release --build-number ${{ github.run_number }}
      - name: Incluir runtime do Visual C++ (app-local)
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
            Copy-Item "C:\Windows\System32\$dll" $rel -Force
          }
          Get-ChildItem $rel -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\windows\gmn_book.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem releases\windows
      - name: Teste de instalação limpa (instalar, abrir, persistir, desinstalar)
        shell: pwsh
        run: ./tool/ci/windows_install_test.ps1 -Installer (Get-ChildItem releases\windows\*.exe | Select-Object -First 1).FullName
      - name: Teste de integração na plataforma real (Windows)
        run: flutter test integration_test -d windows --reporter expanded
      - uses: actions/upload-artifact@v4
        with:
          name: gmn-book-windows
          path: releases/windows/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  android:
    name: Android (.apk e .aab)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Habilitar build hooks
        run: flutter config --enable-native-assets || true
      - name: Gerar projeto Android e aplicar identidade
        run: |
          flutter create --platforms=android --org $ORG --project-name gmn_book --no-pub .
          python3 tool/patch_platforms.py android
      - run: flutter pub get
      - name: Ícones do Android
        run: dart run flutter_launcher_icons
      - name: Chave de assinatura (segredo do repositório)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/upload-keystore.jks
            printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
            echo "Assinatura de release configurada."
          else
            echo "::warning::Sem chave de assinatura nos segredos: o APK será assinado com chave de depuração."
          fi
      - name: Compilar APK e AAB
        run: |
          flutter build apk --release --build-number ${{ github.run_number }}
          flutter build appbundle --release --build-number ${{ github.run_number }}
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p releases/android
          cp build/app/outputs/flutter-apk/app-release.apk releases/android/GMN-BOOK-$VERSION.apk
          cp build/app/outputs/bundle/release/app-release.aab releases/android/GMN-BOOK-$VERSION.aab
          ls -la releases/android
      - name: Verificar assinatura do APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs releases/android/*.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: gmn-book-android
          path: releases/android/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  android-device-test:
    name: Android — instalar e testar no emulador
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: gmn-book-android
          path: releases/android
      - name: Preparar projeto (para o teste de integração)
        run: |
          flutter config --enable-native-assets || true
          flutter create --platforms=android --org $ORG --project-name gmn_book --no-pub .
          python3 tool/patch_platforms.py android
          flutter pub get
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/ci/android_device_test.sh

  # ---------------------------------------------------------------------------
  release:
    name: Publicar Release
    runs-on: ubuntu-latest
    needs: [windows, android, android-device-test]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gmn-book-windows
          path: releases/windows
      - uses: actions/download-artifact@v4
        with:
          name: gmn-book-android
          path: releases/android
      - name: Checksums
        run: |
          cd releases
          sha256sum windows/* android/* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Versão
        id: ver
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build{1}', steps.ver.outputs.version, github.run_number) }}
          name: GMN BOOK ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body_path: docs/RELEASE_NOTES.md
          files: |
            releases/windows/*.exe
            releases/android/*.apk
            releases/android/*.aab
            releases/SHA256SUMS.txt
